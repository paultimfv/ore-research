name: hourly refresh
on:
  schedule:
    - cron: "20 * * * *"     # hourly, :20 past
  workflow_dispatch:
concurrency: daily
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: pull and build
        working-directory: scripts
        env:
          HELIUS_KEY: ${{ secrets.HELIUS_KEY }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
        run: |
          python -u pull_rounds.py
          python -u pull_buybacks.py
          python build_ore.py > /dev/null
      # the push redeploys the site (Vercel is connected to this repo)
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/raw src/data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%FT%H:%MZ)"
          git pull --rebase && git push
